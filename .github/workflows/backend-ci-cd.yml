name: Backend CI/CD

# DESATIVADO como gatilho automático: a imagem do Docker Hub NÃO é consumida pelo
# App Runner (que puxa do ECR). Mantido apenas como execução manual, para não
# concorrer com o deploy de produção nem duplicar o 'mvn clean test' a cada push.
on:
  workflow_dispatch:

env:
  IMAGE_NAME: alexssilva/bookloop-api

jobs:
  build-test-and-push:
    name: Build, Test and Docker Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Maven clean test
        run: mvn clean test

      - name: Maven package
        run: mvn clean package -DskipTests

      - name: Docker login
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        if: github.event_name == 'push'
        run: |
          docker build -t $IMAGE_NAME:latest -t $IMAGE_NAME:${{ github.sha }} .

      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker push $IMAGE_NAME:latest
          docker push $IMAGE_NAME:${{ github.sha }}