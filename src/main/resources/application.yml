spring:
  application:
    name: bookloop-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bookloop}
    username: ${DB_USER:bookloop}
    password: ${DB_PASSWORD:bookloop}

  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway, never by Hibernate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

security:
  jwt:
    # Override in production via env. Must be >= 32 bytes for HS256.
    secret: ${JWT_SECRET:change-me-please-use-a-long-random-secret-at-least-32-bytes}
    access-ttl-ms: ${JWT_ACCESS_TTL_MS:900000}        # 15 min
    refresh-ttl-ms: ${JWT_REFRESH_TTL_MS:1209600000}  # 14 dias

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  level:
    com.bookloop: INFO
    org.springframework.security: WARN
