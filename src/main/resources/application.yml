spring:
  application:
    name: bookloop-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bookloop}
    username: ${DB_USER:bookloop}
    password: ${DB_PASSWORD:bookloop}

  # SMTP genérico (Gmail/Brevo/SendGrid/SES-SMTP...). Configure via env em produção.
  # Só cria o JavaMailSender quando MAIL_HOST está definido.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway, never by Hibernate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    out-of-order: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

security:
  jwt:
    # Override in production via env. Must be >= 32 bytes for HS256.
    secret: ${JWT_SECRET:change-me-please-use-a-long-random-secret-at-least-32-bytes}
    access-ttl-ms: ${JWT_ACCESS_TTL_MS:900000}        # 15 min
    refresh-ttl-ms: ${JWT_REFRESH_TTL_MS:1209600000}  # 14 dias

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    # Origens permitidas (CORS). Sobrescreva em produção via APP_CORS_ALLOWED_ORIGINS.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,https://kehmmmut47.us-east-1.awsapprunner.com}

management:
  endpoints:
    web:
      exposure:
        include: health      # expõe apenas /actuator/health (+ grupos liveness/readiness)
  health:
    # Desliga o MailHealthIndicator: ele abre uma conexão SMTP (Brevo:587) a cada
    # consulta de /actuator/health. O App Runner não sai na porta 587, então a
    # checagem pendura ~130s -> /actuator/health dá 502 e o health check do serviço
    # reprova -> rollback. Desligar a CHECAGEM não afeta o ENVIO de e-mail.
    mail:
      enabled: false
  endpoint:
    health:
      show-details: when-authorized   # público vê só o status; detalhes p/ quem tem credencial
      probes:
        enabled: true                 # habilita /actuator/health/liveness e /readiness
      group:
        # LIVENESS: "o processo está vivo?" NÃO depende do banco.
        # É o que o App Runner deve chamar como health check — um soluço transitório
        # do RDS não pode derrubar a instância num ciclo de restart.
        liveness:
          include: livenessState
        # READINESS: "posso receber tráfego?" — aí sim inclui banco e migrations.
        readiness:
          include: readinessState, db, flyway

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  level:
    com.bookloop: INFO
    org.springframework.security: WARN

bookloop:
  mail:
    # Liga/desliga o envio real. Em dev fica false (a app roda sem SMTP).
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:BookLoop <no-reply@bookloop.app>}
