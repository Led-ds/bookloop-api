name: deploy-backend

# CI roda em PR e push; CD (build+push da imagem) só em push/manual e SOMENTE se o CI passar.
# O App Runner puxa a imagem automaticamente (AutoDeploymentsEnabled) — por isso NÃO há
# mais 'start-deployment' aqui: ele concorreria com o auto-deploy e falhava com
# "isn't in RUNNING state".
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: bookloop-api
  ECR_REGISTRY: 817312833927.dkr.ecr.us-east-1.amazonaws.com

jobs:
  ci:
    name: CI — build e testes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test backend
        run: mvn clean test

  cd:
    name: CD — build, push ECR (auto-deploy do App Runner)
    runs-on: ubuntu-latest
    needs: ci                                   # só publica imagem se o CI passar
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} \
            .

      - name: Push Docker image to ECR
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
          echo "Imagem publicada. O App Runner fará o deploy automaticamente (AutoDeploymentsEnabled)."
